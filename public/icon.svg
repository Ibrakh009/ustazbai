<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#2d1254" />
      <stop offset="60%" stop-color="#120726" />
      <stop offset="100%" stop-color="#080312" />
    </radialGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#7e22ce" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.6" />
    </linearGradient>

    <!-- Emblem Gradient -->
    <linearGradient id="uGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#e9d5ff" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Star Glow -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <filter id="neonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#a855f7" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Inner Ambient Circle -->
  <circle cx="256" cy="230" r="150" fill="#9333ea" opacity="0.12" filter="blur(30px)" />

  <!-- Main Monogram "U" with Upward Arrow / Peak Shape -->
  <g filter="url(#neonShadow)">
    <!-- Stylized U Path -->
    <path
      d="M160 144 
         V260 
         C160 315 202 356 256 356 
         C310 356 352 315 352 260 
         V144 
         H296 
         V254 
         C296 278 278 298 256 298 
         C234 298 216 278 216 254 
         V144 
         Z"
      fill="url(#uGrad)"
    />

    <!-- Upward Growth Apex / Star inside U -->
    <polygon
      points="256,156 270,188 304,192 278,214 286,248 256,230 226,248 234,214 208,192 242,188"
      fill="url(#starGrad)"
    />
  </g>

  <!-- Brand Subtext: USTAZ -->
  <text
    x="256"
    y="425"
    text-anchor="middle"
    fill="#f3e8ff"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="44"
    font-weight="900"
    letter-spacing="9"
  >USTAZ</text>

  <!-- Micro Sub-label: KZ -->
  <text
    x="256"
    y="455"
    text-anchor="middle"
    fill="#a855f7"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="16"
    font-weight="700"
    letter-spacing="6"
  >MENTORS · KZ</text>
</svg>
